
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager | DevOps Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Task Manager</h1>
            <p>Organize your work and stay productive.</p>
        </header>

        <section class="task-form">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
            >
            <button id="addTaskButton">Add Task</button>
        </section>

        <section class="statistics">
            <div class="stat-card">
                <h3 id="totalTasks">0</h3>
                <p>Total Tasks</p>
            </div>

            <div class="stat-card">
                <h3 id="completedTasks">0</h3>
                <p>Completed</p>
            </div>

            <div class="stat-card">
                <h3 id="pendingTasks">0</h3>
                <p>Pending</p>
            </div>
        </section>

        <section class="task-section">
            <h2>My Tasks</h2>
            <ul id="taskList"></ul>
            <p id="emptyMessage">No tasks yet. Add your first task!</p>
        </section>

        <footer>
            <p>DevOps Midterm Project | Task Manager</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
