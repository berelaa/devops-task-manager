
name: DevOps Task Manager CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '*/5 * * * *'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Deploy application
        id: deploy
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            DEPLOYMENT_URL=$(npx --yes vercel@latest deploy --prod --skip-domain --yes --token="$VERCEL_TOKEN")
          else
            DEPLOYMENT_URL=$(npx --yes vercel@latest deploy --yes --token="$VERCEL_TOKEN")
          fi

          echo "Deployment URL: $DEPLOYMENT_URL"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check staged deployment
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
        run: |
          echo "Checking staged production deployment..."

          for attempt in {1..6}; do
            if curl --fail --silent --show-error "$DEPLOYMENT_URL" > /dev/null; then
              echo "Health Check passed!"
              exit 0
            fi

            echo "Attempt $attempt failed. Retrying in 10 seconds..."
            sleep 10
          done

          echo "Health Check failed. Production release will be cancelled."
          exit 1

  promote:
    name: Promote to Production
    runs-on: ubuntu-latest
    needs: [deploy, health-check]
if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs['health-check'].result == 'success'
    steps:
      - name: Promote verified deployment
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@latest promote "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"
          echo "Verified deployment promoted to Production!"

  monitoring:
    name: Monitoring Health Check
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push' || github.event_name == 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run Health Check
        run: node monitoring/healthCheck.js

      - name: Upload Health Check Log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: health-check-log
          path: monitoring/health-check.log
          if-no-files-found: warn
